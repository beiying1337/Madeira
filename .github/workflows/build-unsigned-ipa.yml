name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, codex/zh-hans-unsigned-ipa]
    paths:
      - app/**
      - build/**
      - scripts/ci-build-dependencies.sh
      - scripts/patch-shell32-null-target.py
      - .github/workflows/build-unsigned-ipa.yml
      - .github/patches/**

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 330
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    permissions:
      contents: read

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Apply GUI desktop boot patch
        run: git apply --verbose .github/patches/hide-boot-cmd.patch

      - name: Install build tools
        run: |
          brew install autoconf automake bison cmake flex meson ninja pkg-config llvm sevenzip
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Restore compiled dependency cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            FEX/build-ios
            toolchains
            wine/build-macos
            wine/build-arm64ec
            build/freetype-ios/build
            build/gnutls-ios/obj
            build/ntdll-unix/obj
            build/win32u-unix/obj
            build/wineserver/obj
            build/dxmt-ios/obj
            app/Madeira/*.a
          key: madeira-ios-deps-xcode26.6-v1-${{ runner.arch }}-${{ hashFiles('.gitmodules', 'FEX', 'wine', 'research/dxmt', 'build/**/*.sh', 'scripts/ci-build-dependencies.sh') }}
          restore-keys: |
            madeira-ios-deps-xcode26.6-v1-${{ runner.arch }}-

      - name: Build native dependencies
        run: bash scripts/ci-build-dependencies.sh

      - name: Save partial dependency cache
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            FEX/build-ios
            toolchains
            wine/build-macos
            wine/build-arm64ec
            build/freetype-ios/build
            build/gnutls-ios/obj
            build/ntdll-unix/obj
            build/win32u-unix/obj
            build/wineserver/obj
            build/dxmt-ios/obj
            app/Madeira/*.a
          key: madeira-ios-deps-xcode26.6-v1-${{ runner.arch }}-${{ hashFiles('.gitmodules', 'FEX', 'wine', 'research/dxmt', 'build/**/*.sh', 'scripts/ci-build-dependencies.sh') }}

      - name: Fetch and verify Microsoft Visual C++ x64 runtime
        run: |
          set -euo pipefail

          sevenzip_allow_warning() {
            set +e
            7zz "$@"
            status=$?
            set -e
            if [ "$status" -gt 1 ]; then
              return "$status"
            fi
            return 0
          }

          RUNTIME_DIR="$GITHUB_WORKSPACE/app/Madeira/x86_64-vcruntime"
          DOWNLOAD_DIR="$RUNNER_TEMP/vcredist-download"
          PARSER_DIR="$DOWNLOAD_DIR/parser"
          PACKAGE_DIR="$DOWNLOAD_DIR/packages"
          UNPACK_DIR="$DOWNLOAD_DIR/unpacked"
          mkdir -p "$RUNTIME_DIR" "$PARSER_DIR" "$PACKAGE_DIR" "$UNPACK_DIR"

          curl --fail --location --retry 3 \
            "https://aka.ms/vs/17/release/vc_redist.x64.exe" \
            --output "$DOWNLOAD_DIR/VC_redist.x64.exe"

          # VC_redist is a PE bootstrapper with an appended WiX/Burn payload.
          # 7-Zip parser mode exposes that payload as 4.cab. Exit code 1 only
          # means the signed PE has trailing data, so it is a successful warning.
          sevenzip_allow_warning -t# x -y \
            "$DOWNLOAD_DIR/VC_redist.x64.exe" \
            -o"$PARSER_DIR" \
            4.cab
          test -s "$PARSER_DIR/4.cab"

          sevenzip_allow_warning x -y "$PARSER_DIR/4.cab" -o"$PACKAGE_DIR"

          package_index=0
          while IFS= read -r package; do
            package_index=$((package_index + 1))
            destination="$UNPACK_DIR/package-$package_index"
            mkdir -p "$destination"
            set +e
            7zz x -y "$package" -o"$destination"
            status=$?
            set -e
            if [ "$status" -gt 1 ]; then
              rm -rf "$destination"
            fi
          done < <(find "$PACKAGE_DIR" -maxdepth 1 -type f -print)

          for dll in \
            concrt140.dll \
            msvcp140.dll \
            msvcp140_1.dll \
            msvcp140_2.dll \
            msvcp140_atomic_wait.dll \
            msvcp140_codecvt_ids.dll \
            vcamp140.dll \
            vccorlib140.dll \
            vcomp140.dll \
            vcruntime140.dll \
            vcruntime140_1.dll \
            vcruntime140_threads.dll
          do
            source_file=$(find "$UNPACK_DIR" "$PACKAGE_DIR" -type f \
              \( -iname "$dll" -o -iname "${dll}_amd64" \) -print -quit)
            if [ -z "$source_file" ]; then
              echo "::error::Microsoft x64 redistributable did not contain $dll"
              exit 1
            fi
            ditto "$source_file" "$RUNTIME_DIR/$dll"
          done

          python3 - "$RUNTIME_DIR" <<'PY'
          import hashlib
          import pathlib
          import struct
          import sys

          expected = (
              "concrt140.dll",
              "msvcp140.dll",
              "msvcp140_1.dll",
              "msvcp140_2.dll",
              "msvcp140_atomic_wait.dll",
              "msvcp140_codecvt_ids.dll",
              "vcamp140.dll",
              "vccorlib140.dll",
              "vcomp140.dll",
              "vcruntime140.dll",
              "vcruntime140_1.dll",
              "vcruntime140_threads.dll",
          )
          root = pathlib.Path(sys.argv[1])
          actual = sorted(path.name for path in root.glob("*.dll"))
          if actual != sorted(expected):
              raise SystemExit(f"runtime file set mismatch: {actual}")

          for name in expected:
              path = root / name
              data = path.read_bytes()
              if len(data) < 0x100 or data[:2] != b"MZ":
                  raise SystemExit(f"{name}: not a PE file")
              pe = struct.unpack_from("<I", data, 0x3C)[0]
              if data[pe:pe + 4] != bytes((0x50, 0x45, 0, 0)):
                  raise SystemExit(f"{name}: invalid PE signature")
              machine = struct.unpack_from("<H", data, pe + 4)[0]
              if machine != 0x8664:
                  raise SystemExit(f"{name}: expected x86_64 PE, machine={machine:#x}")
              optional = pe + 24
              magic = struct.unpack_from("<H", data, optional)[0]
              directory = optional + (112 if magic == 0x20B else 96)
              cert_offset, cert_size = struct.unpack_from(
                  "<II", data, directory + 4 * 8
              )
              if not cert_size or cert_offset + cert_size > len(data):
                  raise SystemExit(f"{name}: missing intact Authenticode payload")
              digest = hashlib.sha256(data).hexdigest()
              print(f"verified {name} sha256={digest}")
          PY

      - name: Build app without signing
        run: |
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -target Madeira \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$RUNNER_TEMP/DerivedData/Build/Products" \
            OBJROOT="$RUNNER_TEMP/DerivedData/Build/Intermediates.noindex" \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            clean build

      - name: Install Wine fonts and complete NLS tables
        run: |
          set -euo pipefail

          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p "$APP_PATH/fonts" "$APP_PATH/nls"

          while IFS= read -r font; do
            ditto "$font" "$APP_PATH/fonts/$(basename "$font")"
          done < <(find wine/fonts -maxdepth 1 -type f -name '*.ttf' -print)

          while IFS= read -r table; do
            ditto "$table" "$APP_PATH/nls/$(basename "$table")"
          done < <(find wine/nls -maxdepth 1 -type f -name '*.nls' -print)

          test -s "$APP_PATH/fonts/tahoma.ttf"
          test -s "$APP_PATH/fonts/marlett.ttf"
          test -s "$APP_PATH/nls/c_936.nls"
          test -s "$APP_PATH/nls/c_10000.nls"

          FONT_COUNT=$(find "$APP_PATH/fonts" -maxdepth 1 -type f -name '*.ttf' | wc -l | tr -d ' ')
          NLS_COUNT=$(find "$APP_PATH/nls" -maxdepth 1 -type f -name '*.nls' | wc -l | tr -d ' ')
          echo "Bundled $FONT_COUNT Wine fonts and $NLS_COUNT NLS tables"

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/Madeira.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/Madeira-zh-Hans-unsigned.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/Madeira-zh-Hans-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-zh-Hans-unsigned-${{ github.run_number }}
          path: Madeira-zh-Hans-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
