name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, codex/zh-hans-unsigned-ipa]
    paths:
      - app/**
      - build/**
      - scripts/ci-build-dependencies.sh
      - .github/workflows/build-unsigned-ipa.yml

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 330
    permissions:
      contents: read

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build tools
        run: |
          brew install autoconf automake bison cmake flex meson ninja pkg-config llvm sevenzip
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Restore compiled dependency cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            FEX/build-ios
            toolchains
            wine/build-macos
            wine/build-arm64ec
            build/freetype-ios/build
            build/gnutls-ios/obj
            build/ntdll-unix/obj
            build/win32u-unix/obj
            build/wineserver/obj
            build/dxmt-ios/obj
            app/Madeira/*.a
          key: madeira-ios-deps-v1-${{ runner.arch }}-${{ hashFiles('.gitmodules', 'FEX', 'wine', 'research/dxmt', 'build/**/*.sh', 'scripts/ci-build-dependencies.sh') }}
          restore-keys: |
            madeira-ios-deps-v1-${{ runner.arch }}-

      - name: Build native dependencies
        run: bash scripts/ci-build-dependencies.sh

      - name: Save partial dependency cache
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            FEX/build-ios
            toolchains
            wine/build-macos
            wine/build-arm64ec
            build/freetype-ios/build
            build/gnutls-ios/obj
            build/ntdll-unix/obj
            build/win32u-unix/obj
            build/wineserver/obj
            build/dxmt-ios/obj
            app/Madeira/*.a
          key: madeira-ios-deps-v1-${{ runner.arch }}-${{ hashFiles('.gitmodules', 'FEX', 'wine', 'research/dxmt', 'build/**/*.sh', 'scripts/ci-build-dependencies.sh') }}

      - name: Fetch Microsoft Visual C++ x64 runtime
        run: |
          set -euo pipefail

          RUNTIME_DIR="$GITHUB_WORKSPACE/app/Madeira/x86_64-vcruntime"
          DOWNLOAD_DIR="$RUNNER_TEMP/vcredist-download"
          EXTRACT_DIR="$RUNNER_TEMP/vcredist-extracted"
          mkdir -p "$RUNTIME_DIR" "$DOWNLOAD_DIR" "$EXTRACT_DIR"

          curl --fail --location --retry 3 \
            "https://aka.ms/vs/17/release/vc_redist.x64.exe" \
            --output "$DOWNLOAD_DIR/VC_redist.x64.exe"

          7zz x -y "$DOWNLOAD_DIR/VC_redist.x64.exe" -o"$DOWNLOAD_DIR/outer"

          CAB_COUNT=0
          while IFS= read -r cab; do
            CAB_COUNT=$((CAB_COUNT + 1))
            7zz x -y "$cab" -o"$EXTRACT_DIR/cab-$CAB_COUNT"
          done < <(find "$DOWNLOAD_DIR/outer" -type f -iname '*.cab' -print)

          test "$CAB_COUNT" -gt 0

          for dll in \
            concrt140.dll \
            msvcp140.dll \
            msvcp140_1.dll \
            msvcp140_2.dll \
            msvcp140_atomic_wait.dll \
            msvcp140_codecvt_ids.dll \
            vcamp140.dll \
            vccorlib140.dll \
            vcomp140.dll \
            vcruntime140.dll \
            vcruntime140_1.dll \
            vcruntime140_threads.dll
          do
            source_file=$(find "$EXTRACT_DIR" -type f -iname "$dll" -print -quit)
            if [ -z "$source_file" ]; then
              echo "::error::Microsoft redistributable did not contain $dll"
              exit 1
            fi
            ditto "$source_file" "$RUNTIME_DIR/$dll"
          done

          test "$(find "$RUNTIME_DIR" -maxdepth 1 -type f -name '*.dll' | wc -l | tr -d ' ')" -eq 12

      - name: Build app without signing
        run: |
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -target Madeira \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$RUNNER_TEMP/DerivedData/Build/Products" \
            OBJROOT="$RUNNER_TEMP/DerivedData/Build/Intermediates.noindex" \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            clean build

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/Madeira.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/Madeira-zh-Hans-unsigned.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/Madeira-zh-Hans-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-zh-Hans-unsigned-${{ github.run_number }}
          path: Madeira-zh-Hans-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
